name: Generate Profile Trophy

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Download trophy SVG
        run: |
          mkdir -p dist
          curl -fsSL "https://trophygithubreadmelang.cybee.dpdns.org/?username=${{ github.repository_owner }}&theme=dracula&column=-1&row=1&margin-w=8&margin-h=8" \
            -o dist/trophy.svg
          test -s dist/trophy.svg
          grep -q "<svg" dist/trophy.svg

      - name: Push trophy.svg to trophy-output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: trophy-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
